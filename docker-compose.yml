services:
  api:
    build: .
    ports:
      # Host port is overridable ($API_HOST_PORT) so it never collides with
      # something else already bound to 8000 on the host - the container's
      # own port stays fixed at 8000 regardless.
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # The real corpus/embeddings/index live on the host (never baked into
      # the image - they're gitignored, regenerated artifacts and, for the
      # corpus, potentially copyrighted PDFs). Build them first with
      # scripts/embed_corpus.py + scripts/build_index.py, or run those
      # inside the container - see the README.
      - ./data:/app/data
      - ./indexes:/app/indexes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional (project improvement round): only started with
  # `docker compose --profile redis up`, so the default `docker compose up`
  # never pulls a Redis image nobody asked for. To actually use it, also
  # set RATE_LIMIT_BACKEND=redis and REDIS_URL=redis://redis:6379/0 in .env
  # - "redis" is this service's name on the Compose network, NOT the same
  # "redis://localhost:6379/0" default that's correct outside Docker.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  web:
    build:
      context: ./web
      args:
        # Baked into the static bundle at BUILD time (Vite), unlike the api
        # service's env vars, which are read at runtime - this must be a URL
        # the BROWSER can reach (the host), not "http://api:8000" (Docker-
        # internal DNS, unreachable from outside the Compose network).
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}
        VITE_API_KEY: ${API_KEY:-}
    ports:
      - "${WEB_HOST_PORT:-8501}:80"
    depends_on:
      api:
        condition: service_healthy
